name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux jq chezmoi

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y zsh tmux jq shellcheck
          # chezmoi is not in Ubuntu's apt: a pinned release, verified by checksum
          curl -fsSL -o "$RUNNER_TEMP/chezmoi.deb" https://github.com/twpayne/chezmoi/releases/download/v2.72.2/chezmoi_2.72.2_linux_amd64.deb
          echo "310a8f141b940e5dbf0fef33fe27804768c977fa1da72112e27f78797225a526  $RUNNER_TEMP/chezmoi.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/chezmoi.deb"

      - name: Show versions
        run: |
          zsh --version
          tmux -V
          bash --version | head -1
          jq --version
          chezmoi --version

      # Second gate behind the local pre-commit hook (which can be skipped with --no-verify).
      - name: Privacy scan (secrets, personal paths, e-mail addresses)
        run: scripts/privacy-scan --all

      # shellcheck at warning level; --require fails if it is missing, so the gate cannot silently disappear. Linux only: one run is enough.
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: scripts/lint-shell --require

      # Includes tests/smoke.test.sh: the README quick start, run end to end in a throwaway HOME.
      - name: Run tests
        run: tests/run.sh

      # The scripts promise bash 3.2 compatibility; enforce it by running the suite with the macOS system bash.
      - name: Run tests with the macOS system bash (3.2)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -s /bin/bash "$RUNNER_TEMP/bash32/bash"
          PATH="$RUNNER_TEMP/bash32:$PATH" bash --version | head -1
          PATH="$RUNNER_TEMP/bash32:$PATH" tests/run.sh
