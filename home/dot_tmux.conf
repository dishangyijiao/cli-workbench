# ===========================================
# tmux config - efficient development environment
# ===========================================

# Basics
# ===========================================
set -g default-terminal "tmux-256color"      # modern terminal capabilities come from the tmux terminfo
set -g history-limit 20000                 # scrollback size
set -g buffer-limit 20                     # paste buffer count
set -g display-time 1500                   # how long messages are shown (ms)
set -g mouse on                            # enable mouse
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off               # after the current session is killed, switch to another one instead of exiting tmux
set -g base-index 1                        # number windows from 1, matching the keyboard's digit row
setw -g pane-base-index 1
set -g set-clipboard on                    # system clipboard support

# Outer terminal (Ghostty) tab title = tmux session name (name sessions after projects).
# Bell handling stays at the defaults (bell-action any, visual-bell off): a BEL in a pane is passed
# through to Ghostty, which then prefixes the background tab title with a bell emoji.
set -g set-titles on
set -g set-titles-string '#S'

# New panes inherit the client's proxy environment (proxy values are managed by the client or the shell)
# Set the whole list instead of appending with -a: appending duplicates the entries on every reload.
# The first eight names are tmux's own defaults; the rest are the proxy variables.
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy no_proxy"

# Change the prefix to Ctrl+a (more ergonomic, easier to reach)
# ===========================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Pane splitting
# ===========================================
bind | split-window -h -c "#{pane_current_path}"    # split horizontally |
bind - split-window -v -c "#{pane_current_path}"    # split vertically -
unbind '"'
unbind %

# Vim-style pane navigation
# ===========================================
bind h select-pane -L    # left
bind j select-pane -D    # down
bind k select-pane -U    # up
bind l select-pane -R    # right

# Resize panes (in steps of 5)
# ===========================================
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window management
# ===========================================
bind c new-window -c "#{pane_current_path}"  # create a new window
bind , command-prompt -I "#W" "rename-window '%%'"  # rename the window
bind > swap-window -t +1  # move the window forward
bind < swap-window -t -1  # move the window backward

# Session management
# ===========================================
bind S command-prompt -p "New Session:" "new-session -A -s '%%'"  # create or attach to a session
# prefix + N: create (or switch to) a session named after the current pane's directory.
# tmux replaces . and : in session names with _, so do the same here first.
# The directory name is text a repository controls, so it must never be pasted into the shell command: tmux expands every
# #{...} in the string before the shell runs, and $(...) in a name would execute. Only the pane id (%N) is expanded here;
# ##{...} reaches the inner tmux as a literal, and that tmux hands the path back as data.
bind N run-shell 'p=$(tmux display-message -p -t "#{pane_id}" "##{pane_current_path}"); n=$(basename "$p" | tr ".:" "__"); tmux has-session -t "=$n" 2>/dev/null || tmux new-session -d -s "$n" -c "$p"; tmux switch-client -t "=$n"'
bind X confirm-before -p "Kill session #S? (y/n)" kill-session
# prefix + P: fzf picker over ~/dev/projects -> open or switch to that workspace's session (a project, or a
# group such as my-product with one window per repo; an AI agent over a shell, no editor pane).
# See ~/.tmux/scripts/workspace-switch.sh
# display-popup needs tmux >= 3.2; on an older tmux this binding is simply skipped.
# The switcher scans ~/dev/projects by default. To scan other roots (space separated), uncomment and edit:
# set-environment -g WORKSPACE_ROOTS "$HOME/code $HOME/work"
# The first installed of claude, codex, gemini, grok starts in the right-hand top pane. To choose one, change the list, or turn it off:
# set-environment -g WORKSPACE_SWITCH_AGENT "claude --continue"      # or: none
# set-environment -g WORKSPACE_SWITCH_AGENTS "aider claude codex"
if-shell "~/.tmux/scripts/tmux-version-ge.sh 3 2" \
  'bind P display-popup -E -w 70% -h 70% "~/.tmux/scripts/workspace-switch.sh"'
# prefix + e: Neovim over the current pane, to browse the project; :qa closes it.
# prefix + g: the files the branch changed since it left main, with a diff preview; <CR> opens one beside its old version.
# Only the pane id is expanded; ~/.tmux/scripts/code-popup.sh looks up the directory itself.
if-shell "~/.tmux/scripts/tmux-version-ge.sh 3 2" \
  'bind e display-popup -E -w 90% -h 90% "~/.tmux/scripts/code-popup.sh browse #{pane_id}"; bind g display-popup -E -w 90% -h 90% "~/.tmux/scripts/code-popup.sh changes #{pane_id}"'

# Copy mode (Vim style)
# ===========================================
setw -g mode-keys vi  # use vi key bindings
bind v copy-mode \; send -X begin-selection  # prefix+v enters copy mode and starts selecting
bind -T copy-mode-vi v send -X begin-selection  # 'v' starts the selection
bind -T copy-mode-vi y send -X copy-selection   # 'y' copies the selection
bind -T copy-mode-vi r send -X rectangle-toggle  # 'r' toggles rectangle selection

# prefix + t: translate or look up the text you just selected, in a popup, so the pane you are reading stays put.
# A mouse selection and `y` in copy mode both fill the newest paste buffer, which is what the popup reads.
# Needs translate-shell (brew install translate-shell). See ~/.tmux/scripts/lookup.sh
# display-popup needs tmux >= 3.2; on an older tmux this binding is simply skipped.
if-shell "~/.tmux/scripts/tmux-version-ge.sh 3 2" \
  'bind t display-popup -E -w 70% -h 60% "~/.tmux/scripts/lookup.sh"'

# Convenience keys
# ===========================================
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # reload the config
bind m setw synchronize-panes  # synchronize panes (typed input goes to all panes)

# Quick pane jump (show pane numbers for longer, easier to pick)
# ===========================================
set -g display-panes-time 2000  # show pane numbers for 2 seconds
set -g display-panes-colour colour166
set -g display-panes-active-colour colour33

# Alt+digit jumps to a pane (no prefix needed)
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6
bind -n M-7 select-pane -t 7
bind -n M-8 select-pane -t 8
bind -n M-9 select-pane -t 9

# Quick window switching: Ctrl+a then a digit; Ctrl+a w opens the window list
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9
bind w choose-tree -Zw

# Status bar
# ===========================================
set -g status-position bottom
set -g status-interval 5
# Pane borders and titles (Catppuccin Mocha)
set -g pane-border-status top
set -g pane-border-style fg=#585b70,bg=#1e1e2e
set -g pane-active-border-style fg=#89b4fa,bg=#313244
# Top of every pane: number │ project directory ⎇ branch. branch.sh gets the pane id and looks the directory up itself:
# a directory name must not be pasted into the shell command (see prefix + N above).
# (While Claude Code runs, pane_current_command is just its version number and carries no information.)
set -g pane-border-format ' #[fg=#a6adc8]#P #[fg=#6c7086]│ #[fg=#89b4fa,bold]#{b:pane_current_path}#[nobold] #[fg=#a6e3a1]#(~/.tmux/scripts/branch.sh "#{pane_id}") '
set -g status-style fg=colour136,bg=colour235
set -g status-left '#[fg=green]#S '
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

# Window name = project directory of the active pane, not the command name
# (Claude Code would show up as its version number).
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

setw -g window-status-current-style fg=colour81,bg=colour238,bold
setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '

setw -g window-status-style fg=colour138,bg=colour235
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# Plugin settings
# ===========================================
# Smart pane switching and Neovim integration
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Plugin management
# ===========================================
# For plugins to take effect, make sure tpm is installed first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# Then enter tmux and press `prefix + I` (capital I) to install the plugins.
# The prefix key is C-a.

# Plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '20000'
set -g @fzf-url-open 'open'

# Auto save and restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
# Off by default: saving pane contents writes everything printed in a pane (tokens included) to disk in plaintext.
# Turn it on yourself if you want it:  set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-strategy-nvim 'session'

# Initialize the plugin manager (keep this at the very end of the file)
# tpm is optional: without it the config above still works, only the plugins are missing.
if-shell "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
